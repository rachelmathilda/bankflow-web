# TODO: 
# trigger ke main
# gate jalan kalau CI lolos
# checkout, setup node, npm ci
# install vercel cli. then vercel pull, vercel build, vercel deploy
# secrets di github: vercel token, org id, project id
# env variable NEXT_PUBLIC_API_URL di set ke dashboard vercel

name: bankflow-web CD

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm install -g vercel@latest
      - run: vercel --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}